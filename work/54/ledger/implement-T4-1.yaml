summary: 'T4 (S20) is done. Both docs pages now say how to see what a run is doing
  from outside its session. I checked the wording against the engine on core''s run
  branch `origin/fab0/54/base` (T1 to T3 merged): `events.py`, `cli.py`, the run and
  inbox skills, and `tests/test_log.py`.


  In `/Users/zhen/Work/Fab0/docs/.git/fab0/worktrees/54/implement-T4/docs/explanation/execution.md`:

  - A new section, "Following a run from outside its session", sits before "Hand-outs
  and briefs". It says what the log holds: hand-outs (not actions), records and gate
  decisions, `apply` entries with a repeated report logged once, and `waiting` and
  `blocked` states. It says what the log leaves out: a person''s gate decision as
  an event, what an agent does inside a unit, and the brief, return data and findings.

  - The same section says where the log is kept: `fab0/events/<run>.jsonl` in the
  home repo''s git common directory. The log is local to the machine, shared by every
  checkout, and never committed, pushed or sent to the tracker. It does not show a
  run driven on another machine.

  - It describes `fab0-resolve log <run>` with an example of its output, `--follow`
  (about two seconds, Ctrl-C ends it with exit 0, waits for a run with no events yet),
  the `event N can''t be read` line, and that `log` needs only the home checkout (no
  `gh`, no wiring, `--project` from anywhere).

  - It says `/fab0:run` shows the follow command once, at the start of the first round,
  and `/fab0:inbox` shows each open run''s latest event.

  - The "The inbox" section also mentions the latest event now.


  In `/Users/zhen/Work/Fab0/docs/.git/fab0/worktrees/54/implement-T4/docs/reference/commands.md`:

  - `fab0-resolve log <run>` is added to the command table. The opening sentence now
  says `log` prints text on success.

  - The `/fab0:run` and `/fab0:inbox` rows mention the follow command and the latest
  event.

  - The `apply` row gains `follow`, and the `inbox` row gains `latest`.

  - A `--follow` row is added to the options table. `--profile` and `--as` no longer
  list `log`.

  - A new "The event log" subsection gives the event fields, the guarantees (read-only
  commands never write; a failed write becomes a warning and never changes the result
  or exit code), an example, the empty-run message `run 77 has no events here yet`,
  and the exit-2 usage errors.

  - The "Older engine" paragraph now says `log` makes no version check.


  The example log lines are made up for the docs: the `apply: spec: merged into backend:fab0/54/base`
