  a label-decided unit, under either branching. No test at 41466ad covers a label-decided
  gate outside the ledger branch. The row says `into: [base]` with `allow_base: true`
  lets apply merge such a unit into the base branch, and that claim can''t be verified;
  the code says otherwise. A person has to decide whether this is a fab0-core bug,
