summary: 'I removed the claim that a round of `next --apply` reads the tracker once.
  Both pages now say what the spec promises. The hand-outs reuse the last read `apply`
  made, so only `next`''s own read is saved. A round whose `apply` changes nothing
  is one tracker pass. When `apply` changes something, such as a merge, it reads the
  tracker afresh to see the effect, and the hand-outs come from that last read.


  Changes in the task''s two files:

  - docs/explanation/execution.md, loop step 1: replaced ''The round reads the tracker
  once, not once per command'' with the wording above.

  - docs/explanation/execution.md, closing line: now says `next --apply` is the same
  work without `next`''s own read of the tracker. It said ''from one tracker pass''.

  - docs/reference/commands.md, `### next --apply` section: replaced ''so the tracker
  is read once for the round instead of once by each command'' with the wording above.

  - docs/reference/commands.md, `next` row of the table: ''from the same read of the
  tracker'' is now ''from the last read of the tracker `apply` made''.


  I added no tests, since this is a docs-only task. I did not change the `record`
  row or the `--unit` text, which the gate accepted.


