verdict:
  decision: approve
  reasons:
  - S23 is met. docs/reference/commands.md documents `next <run> [--apply]` in the
    commands table, the options table and a new `### next --apply` section. That section
    covers what the command returns (`applied`, `kind`, `handouts`, `units`), says
    `--unit` limits only the hand-outs (exit 4, with `applied` still listed), and
    covers the done/waiting case and the apply-failure case. docs/explanation/execution.md
    describes the three-step loop and the four-turn round, with each hand-out's return
    file, `record` and commit chained in one Bash call and the round's calls sent
    in one message. I checked all of this against cmd_next, settle and plugins/fab0/skills/run/SKILL.md
    in fab0-core at origin/fab0/55/base, and it matches.
  - Attempt 3 fixes the finding from gate 2. Neither page claims any longer that a
    round reads the tracker once. Both now say the hand-outs reuse the last read `apply`
    made, that a round is one tracker pass only when `apply` changes nothing (S13),
    and that `apply` reads the tracker again after a change (S7). This matches settle
    in apply.py. The `record` row still names the `run.online()` fallback that gate
    1 asked for.
  - 'Scope: `git diff --name-only origin/fab0/55/base...fab0/55/implement-T4`, with
    the ledger excluded, lists only docs/reference/commands.md and docs/explanation/execution.md.'
  - 'Checks, run in the T4 worktree, all pass: `uvx pymarkdownlnt scan -r docs README.md
    CONTRIBUTING.md`, `uvx codespell` (as CI runs it, from the repository root), and
    `FAB0_CORE=/Users/zhen/Work/Fab0/fab0-core python3 scripts/check-reference.py`.'
