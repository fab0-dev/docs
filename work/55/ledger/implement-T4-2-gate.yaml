verdict:
  decision: reject
  reasons:
  - 'S23 is mostly covered. Both pages describe `next --apply` and what it returns
    (`applied`, `kind`, `handouts`, `units`). They say that `--unit` limits only the
    hand-outs, give exit 4 with `applied`, cover the done/waiting case and the apply-failure
    case, and describe the four-turn loop with chained record and commit in one message.
    I checked all of this against cli.py, apply.py and skills/run/SKILL.md on fab0-core
    origin/fab0/55/base. The `record` row fixed in attempt 2 now matches cmd_record
    and load_run: the run''s item is read only to pick the pipeline, and the code
    falls back to `run.online()` for a unit the offline run lacks.'
  - 'The diff touches only the task''s two files (the ledger files under work/55/ledger
    are the factory''s). The CI checks I could run pass: `uvx pymarkdownlnt scan -r
    docs README.md CONTRIBUTING.md`, `uvx codespell`, and `FAB0_CORE=/Users/zhen/Work/Fab0/fab0-core
    python3 scripts/check-reference.py`.'
  - Both pages still claim that a round of `next --apply` reads the tracker once.
    That is false whenever `apply` changes something. `settle` in apply.py evaluates
    again, with a fresh read of the tracker, after every round that made progress,
    such as a merge, which is what S7 requires. Only the hand-outs reuse `apply`'s
    last evaluation. The spec promises one tracker pass only for a quiet round (S13).
    This is the same kind of overclaim the previous gate rejected for `record`, and
    the producer can fix it.
  findings:
  - check: Agreement with the spec
    message: '''The round reads the tracker once, not once per command'' is wrong
      for any round in which `apply` merges or performs something, because `settle`
      then evaluates the run again with a fresh tracker read (S7). Say that the hand-outs
      reuse `apply`''s last read, and that the round needs a single pass only when
      `apply` changes nothing.'
    location: docs/explanation/execution.md:26
  - check: Agreement with the spec
    message: '''so the tracker is read once for the round instead of once by each
      command'' makes the same false claim: `apply` reads the tracker again after
      each round of changes. Only `next`''s own read is saved.'
    location: docs/reference/commands.md:30
