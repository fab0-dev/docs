verdict:
  decision: reject
  reasons:
  - 'S14''s content is all there: the new ''What you see during a run'' section in
    execution.md covers the start lines, the agents'' activity, the end lines with
    outcome and duration, the list after each apply and the durations in the end report.
    ledger.md lists `started` and `ended`. commands.md says `status` gives each unit''s
    duration. Only the three task files changed. pymarkdownlnt and codespell pass.
    check-reference.py passes when run against fab0-core''s origin/fab0/53/base schemas.'
  - Two statements in the reference and explanation pages are wrong about what the
    engine actually writes, and the producer can fix both. First, the ledger example's
    unquoted timestamps load as YAML datetimes, not strings, so an entry copied from
    the example fails the schema. The engine's yaml.safe_dump quotes them. Second,
    the docs give gate decisions in the end line as `approve`/`reject`/`escalate`,
    but the engine writes `approved`/`rejected`/`escalated`.
  findings:
  - check: quality
    message: 'In the ledger example, `started: 2026-10-15T10:00:00Z` and `ended: ...`
      are unquoted, so yaml.safe_load reads them as datetime objects, not the strings
      the schema''s `time` type requires. The engine''s yaml.safe_dump writes them
      quoted (''2026-10-15T10:00:00Z''). Quote them so the example matches real entries
      and is valid against the schema (S7).'
    location: docs/explanation/../reference/ledger.md:29
  - check: quality
    message: 'Same problem for `ended` in the ledger example: it needs quotes to stay
      a string.'
    location: docs/reference/ledger.md:30
  - check: agreement
    message: 'The end-line bullet says a gate''s line gives its decision as `approve`,
      `reject` or `escalate`, but gates.py on fab0-core origin/fab0/53/base writes
      `approved`, `rejected` or `escalated` (e.g. `implement-T2, attempt 1: rejected,
      1m 5s`, as in S6). Use the words the line actually shows, or give an example.'
    location: docs/explanation/execution.md:42
  - check: tests
    message: 'Non-blocking: CI runs check-reference.py against the fab0-core ref pinned
      in the released marketplace, which doesn''t have `started`/`ended` yet. This
      page will fail that CI check until the release that ships T1 is out. The spec
      expects this (the release follows the run), but whoever merges should know.'
    location: .github/workflows/docs.yml:33
