pipeline: docs
trigger: {issue: {type: Docs}}
onStart:
  - git.run-branch
  - pr.open-run: {draft: true}
steps:
  # The brief and its task list, files in the runs repository, reviewed in their pull request there: the docs
  # owner's approval (an approving review, or /approve) approves them, and fab0 merges it.
  - step: brief
    gate: {human: {owner: docs-owner, via: pr}}
    done: {pr: {repo: runs, state: approved}}
  # One unit per page or section; the reviewer runs on a different model class from the writer.
  - foreach: tasks
    id: pages
    onStart:
      - tracker.child.sync: {type: Task, title: "{unit.title}"}
    steps:
      - step: write
        gate: {auto: {agent: docs-reviewer, model: deep}, retry: 2, then: human}
        done: {issue: {status: Done}}
    onEnd:
      - tracker.child.close: {type: Task}
onEnd:
  - git.sync-base
  - pr.merge # the run pull request into main, once its required checks pass
