pipeline: docs
trigger: {issue: {type: Docs}}
onStart:
  - git.run-branch
  - pr.open-run: {draft: true}
steps:
  # The brief and its task list, kept in the run store and approved by the docs owner merging their review
  # pull request in the runs repository.
  - step: brief
    gate: {human: {owner: docs-owner}}
  # One unit per page or section; the reviewer runs on a different model class from the writer.
  - foreach: tasks
    id: pages
    onStart:
      - tracker.child.sync: {type: Task, title: "{unit.title}"}
    steps:
      - step: write
        gate: {auto: {agent: docs-reviewer, model: deep}, merge: auto, retry: 2, then: human}
    onEnd:
      - tracker.child.close: {type: Task}
onEnd:
  - git.sync-base
  - pr.ready
